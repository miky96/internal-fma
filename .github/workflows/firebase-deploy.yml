name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

# Evita que dos deploys es trepitgin si arriben dos pushes seguits.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        # Fixat a Node 22 LTS expressament: Node 24 (.nvmrc) te una regressio
        # HTTP (>=24.17) que provoca "Premature close" al bescanvi del token
        # OAuth de googleapis durant el deploy de firebase-tools.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm run build` ja fa `tsc --noEmit && vite build`, aixi que typecheck
      # i build van junts. La validacio completa (lint + tests) viu al workflow
      # de PR, que es el gate abans d'arribar a master.
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: "false"
        run: npm run build

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::El secret FIREBASE_SERVICE_ACCOUNT no esta definit o es buit."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          node -e '
            const fs = require("fs");
            let sa;
            try { sa = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/gcp-sa.json", "utf8")); }
            catch (e) { console.error("::error::El secret no es JSON valid: " + e.message); process.exit(1); }
            if (sa.type !== "service_account" || !sa.client_email || !sa.private_key) {
              console.error("::error::El JSON no sembla una clau de service account.");
              process.exit(1);
            }
            console.log("Service account OK: " + sa.client_email + " (project " + sa.project_id + ")");
          '

      # Desplega hosting + regles de Firestore en una mateixa passa.
      - name: Deploy hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" && echo "Fitxer de credencials present i no buit."
          npx --yes firebase-tools deploy \
            --only hosting,firestore:rules \
            --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --debug

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"
