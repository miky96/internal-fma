name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

# Evita que dos deploys es trepitgin si arriben dos pushes seguits.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm run build` ja fa `tsc --noEmit && vite build`, així que typecheck
      # i build van junts. La validació completa (lint + tests) viu al workflow
      # de PR, que és el gate abans d'arribar a master.
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATORS: "false"
        run: npm run build

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::El secret FIREBASE_SERVICE_ACCOUNT no està definit o és buit." \
                 "Comprova Settings > Secrets and variables > Actions del repo."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          # Validació: ha de ser un JSON de service account amb client_email i private_key.
          node -e '
            const fs = require("fs");
            let sa;
            try { sa = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/gcp-sa.json", "utf8")); }
            catch (e) { console.error("::error::El secret no és JSON vàlid: " + e.message); process.exit(1); }
            if (sa.type !== "service_account" || !sa.client_email || !sa.private_key) {
              console.error("::error::El JSON no sembla una clau de service account (falta type/client_email/private_key).");
              process.exit(1);
            }
            console.log("Service account OK: " + sa.client_email + " (project " + sa.project_id + ")");
          '

      # Desplega hosting + regles de Firestore en una mateixa passa.
      # Mantenim "firestore:rules" (no "firestore" sencer) per no tocar els
      # indexes, que de moment no estan versionats en aquest repo.
      - name: Deploy hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
        run: |
          npx --yes firebase-tools deploy \
            --only hosting,firestore:rules \
            --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --non-interactive

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-sa.json"
